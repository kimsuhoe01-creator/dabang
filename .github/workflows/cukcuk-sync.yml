name: CUKCUK menu sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cukcuk-sync.yml"
      - "data/cukcuk-table-qr-layout.json"
      - "scripts/apply-table-qr-layout.mjs"
      - "scripts/translate-menu-data.mjs"
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  # Keep manual/push refreshes serialized with the five-minute store sync.
  group: cukcuk-menu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out menu repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Start from the latest main branch
        shell: bash
        run: git pull --rebase origin main

      - name: Import customer menu from CUKCUK
        env:
          CUKCUK_SECRET_KEY: ${{ secrets.CUKCUK_SECRET_KEY }}
        shell: bash
        run: |
          if [ -z "$CUKCUK_SECRET_KEY" ]; then
            echo "CUKCUK_SECRET_KEY is not configured yet."
            exit 0
          fi

          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-CUKCUK-Secret: $CUKCUK_SECRET_KEY" \
            "https://dabang-tablet-admin.kimsuhoe.chatgpt.site/api/cukcuk/sync")"

          cat "$response_file"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "CUKCUK sync failed with HTTP $status."
            exit 1
          fi

      - name: Publish latest menu data for GitHub Pages
        env:
          CUKCUK_SECRET_KEY: ${{ secrets.CUKCUK_SECRET_KEY }}
          CUKCUK_DETAIL_OUTPUT: ${{ runner.temp }}/cukcuk-target-details.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TRANSLATION_MODEL: gpt-5.6-terra
        shell: bash
        run: |
          mkdir -p data
          curl --silent --show-error --fail \
            --output data/cukcuk-menu.json \
            "https://dabang-tablet-admin.kimsuhoe.chatgpt.site/api/cukcuk/menu"
          jq -e '.ok == true and .synced == true' data/cukcuk-menu.json >/dev/null

          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const secret = process.env.CUKCUK_SECRET_KEY;
          const appId = 'CUKCUKOpenPlatform';
          const domain = 'dabang';
          const branchId = '430a00af-29db-4f30-b8f8-e87bdb793ab0';

          async function syncTables() {
            if (!secret) throw new Error('CUKCUK_SECRET_KEY is not configured.');

            const loginTime = new Date().toISOString();
            const loginShapes = [
              { Domain: domain, AppID: appId, LoginTime: loginTime },
              { AppID: appId, Domain: domain, LoginTime: loginTime }
            ];
            const signatures = [];
            for (const loginData of loginShapes) {
              const json = JSON.stringify(loginData);
              const hmac = encoding => crypto.createHmac('sha256', secret).update(json, 'utf8').digest(encoding);
              signatures.push([loginData, hmac('base64')], [loginData, hmac('hex')]);
            }

            let login = null;
            for (const [loginData, signature] of signatures) {
              const response = await fetch('https://graphapi.cukcuk.vn/api/Account/Login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...loginData, SignatureInfo: signature })
              });
              const result = await response.json().catch(() => null);
              if (response.ok && result?.Success && result.Data?.AccessToken && result.Data?.CompanyCode) {
                login = result.Data;
                break;
              }
            }
            if (!login) throw new Error('CUKCUK automatic login did not return a token.');

            const tableResponse = await fetch(`https://graphapi.cukcuk.vn/api/v1/tables/${branchId}`, {
              headers: {
                Authorization: `Bearer ${login.AccessToken}`,
                CompanyCode: login.CompanyCode,
                'Content-Type': 'application/json'
              }
            });
            const tables = await tableResponse.json().catch(() => null);
            const list = tables?.Data?.ListTable;
            if (!tableResponse.ok || !tables?.Success || !Array.isArray(list) || !list.length) {
              throw new Error('CUKCUK table API did not return a table list.');
            }
            fs.writeFileSync('data/cukcuk-tables.json', JSON.stringify(tables, null, 2) + '\n');
            console.log(`CUKCUK table sync completed: ${list.length} tables.`);

            const headers = {
              Authorization: `Bearer ${login.AccessToken}`,
              CompanyCode: login.CompanyCode,
              'Content-Type': 'application/json'
            };
            const inventory = [];
            for (let page = 1; page <= 10; page++) {
              const response = await fetch('https://graphapi.cukcuk.vn/api/v1/inventoryitems/paging', {
                method: 'POST',
                headers,
                body: JSON.stringify({ Page: page, Limit: 100, BranchId: branchId, CategoryId: '', KeySearch: '', IncludeInactive: false })
              });
              const result = await response.json().catch(() => null);
              if (!response.ok || !result?.Success || !Array.isArray(result.Data)) throw new Error(`inventory page ${page} unavailable`);
              inventory.push(...result.Data);
              if (inventory.length >= Number(result.Total || 0) || result.Data.length < 100) break;
            }
            if (!inventory.length) throw new Error('CUKCUK inventory API did not return any active products.');

            const published = JSON.parse(fs.readFileSync('data/cukcuk-menu.json', 'utf8'));
            const existing = new Map();
            for (const menu of published.menus || []) {
              for (const value of [menu.id, menu.cukcukId]) {
                const key = String(value || '');
                if (key) existing.set(key, menu);
              }
            }

            let appended = 0;
            let annotated = 0;
            for (const item of inventory) {
              if (item.Inactive === true || item.IsInactive === true) continue;
              const id = String(item.Id ?? item.ID ?? item.InventoryItemId ?? item.InventoryItemID ?? '');
              const code = String(item.Code ?? item.InventoryItemCode ?? '').trim();
              if (!id || !code) continue;
              const name = String(item.Name ?? item.InventoryItemName ?? code).trim() || code;
              const price = Number(item.SellingPrice ?? item.Price ?? item.UnitPrice);
              if (!Number.isFinite(price) || price < 0) throw new Error(`inventory product ${code} has an invalid price`);
              const explicitlyUnavailable = item.OutOfStock === true || item.IsOutOfStock === true || item.IsAvailable === false || item.Available === false;
              const menu = existing.get(id);
              if (menu) {
                menu.cukcukId = String(menu.cukcukId || id);
                menu.cukcukCode = code;
                annotated++;
                continue;
              }
              const candidate = {
                id,
                cukcukId: id,
                cukcukCode: code,
                categoryId: '',
                categoryName: '',
                sourceName: name,
                names: { ko: name, vi: '', zh: '', en: '' },
                price,
                available: !explicitlyUnavailable,
                optionGroups: 0,
                optionTemplateIds: [],
                sortOrder: published.menus.length
              };
              published.menus.push(candidate);
              existing.set(id, candidate);
              appended++;
            }
            published.inventoryCandidateCount = published.menus.length;

            const detailConfig = JSON.parse(fs.readFileSync('data/cukcuk-table-qr-layout.json', 'utf8')).detailOptionSources || {};
            const details = [];
            for (const code of Object.keys(detailConfig)) {
              const matches = (published.menus || []).filter(menu => String(menu.cukcukCode || '').trim() === code);
              if (matches.length !== 1) throw new Error(`detail option source ${code} resolved to ${matches.length} menus`);
              const menuId = String(matches[0].id || matches[0].cukcukId || '');
              const response = await fetch(`https://graphapi.cukcuk.vn/api/v1/inventoryitems/detail/${encodeURIComponent(menuId)}`, { headers });
              const result = await response.json().catch(() => null);
              if (!response.ok || !result?.Success || !result.Data) throw new Error(`inventory detail unavailable for ${code}`);
              details.push(result.Data);
            }
            if (!process.env.CUKCUK_DETAIL_OUTPUT) throw new Error('CUKCUK_DETAIL_OUTPUT is not configured.');
            fs.writeFileSync(process.env.CUKCUK_DETAIL_OUTPUT, JSON.stringify({ details }, null, 2) + '\n');
            fs.writeFileSync('data/cukcuk-menu.json', JSON.stringify(published, null, 2) + '\n');
            console.log(`CUKCUK inventory candidates ready: ${inventory.length} active rows, ${annotated} matched customer rows, ${appended} appended candidates, ${details.length} option details.`);
          }

          syncTables().catch(error => {
            console.error(`CUKCUK table/inventory sync failed: ${error.message}`);
            process.exitCode = 1;
          });
          NODE

          node scripts/merge-cukcuk-detail-options.mjs data/cukcuk-menu.json data/cukcuk-table-qr-layout.json "$CUKCUK_DETAIL_OUTPUT"
          node scripts/apply-table-qr-layout.mjs
          node scripts/translate-menu-data.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cukcuk-menu.json data/translation-cache.json
          if [ -f data/cukcuk-tables.json ]; then
            git add data/cukcuk-tables.json
          fi
          if git diff --cached --quiet; then
            echo "Published data is already up to date."
            exit 0
          fi
          git commit -m "Update CUKCUK published data"
          git push

